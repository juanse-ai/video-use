<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Natalia Serrano - Fail Fast</title>

    <style>
      /* Hack para Gmail dark mode */
      u + .body .gmail-blend-screen {
        background: #000;
        mix-blend-mode: screen;
      }

      u + .body .gmail-blend-difference {
        background: #000;
        mix-blend-mode: difference;
      }

      /* Outlook dark mode */
      [data-ogsc] .name,
      [data-ogsc] .name a {
        color: #ffffff !important;
      }

      [data-ogsc] .role,
      [data-ogsc] .role a {
        color: #aeb4c4 !important;
      }

      [data-ogsc] .contact,
      [data-ogsc] .contact a {
        color: #c8ccd8 !important;
      }

      [data-ogsc] .icon {
        color: #7893ff !important;
      }
    </style>
  </head>
